# Thred on Render — Blueprint deploy
# Dashboard → New → Blueprint → connect repo → set sync:false secrets in Render UI.
# After first deploy: add Google OAuth redirect URLs for your thred-web.onrender.com domain.

databases:
  - name: thred-db
    plan: free
    databaseName: thred
    user: thred

services:
  - type: web
    name: thred-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci
    preDeployCommand: npm run db:deploy --workspace=@repo/db
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thred-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: thred-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: thred-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: HYDRA_DB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_PROVIDER
        value: openai

  - type: web
    name: thred-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=frontend
    startCommand: npm run start --workspace=frontend
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thred-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        fromService:
          type: web
          name: thred-api
          envVarKey: BETTER_AUTH_SECRET
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: thred-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_BETTER_AUTH_URL
        fromService:
          type: web
          name: thred-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: thred-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: thred-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
